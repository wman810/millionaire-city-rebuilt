name: Build Portable Apps

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MCITY_RELEASE_VERSION: 0.1.0

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            package_script: package:win
            artifact_suffix: windows-x64
          - label: Linux x64
            os: ubuntu-latest
            package_script: package:linux
            artifact_suffix: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build portable package
        run: npm run ${{ matrix.package_script }}

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: MillionaireCityRebuilt-${{ env.MCITY_RELEASE_VERSION }}-portable-${{ matrix.artifact_suffix }}
          path: release/*.zip
          if-no-files-found: error
